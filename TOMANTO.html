<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TOMANTO</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/fonts-archive/Galmuri/Galmuri11/Galmuri11.css');
*{box-sizing:border-box}html,body{margin:0;background:#0b0a10;color:#f7f1e6;font-family:Galmuri11,monospace;height:100%;overflow:hidden}body{display:grid;place-items:center}.wrap{width:min(100vw,1120px);padding:10px}.shell{position:relative;border:6px solid #262230;box-shadow:0 0 0 3px #040308,0 18px 50px #000;background:#000}.shell canvas{display:block;width:100%;height:auto;image-rendering:pixelated}.hud{position:absolute;inset:10px 12px auto;display:flex;justify-content:space-between;pointer-events:none}.badge{background:#0b0a0edc;border:3px solid #383242;padding:7px 9px;font-size:13px;text-shadow:2px 2px #000}.bar{width:150px;height:14px;background:#17131a;border:2px solid #40384a;margin-top:4px}.fill{height:100%;width:100%;background:#f0525b}.dialog{display:none;position:absolute;left:6%;right:6%;bottom:6%;background:#15121bdx;background:#15121bf2;border:4px solid #ede3cc;box-shadow:8px 8px 0 #030205;padding:14px;z-index:5}.speaker{color:#ffd86a;font-size:16px;margin-bottom:8px}.text{font-size:15px;line-height:1.65;min-height:52px;white-space:pre-wrap}.hint{margin-top:7px;color:#9e97a9;font-size:11px}.toast{display:none;position:absolute;top:58px;left:50%;transform:translateX(-50%);z-index:6;background:#15121bf2;border:3px solid #3b3445;padding:7px 10px;font-size:12px}.start{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#5a1d2d55,transparent 48%),#08070beF;z-index:10;text-align:center}.start h1{margin:0;color:#ff5b66;font-size:clamp(48px,10vw,92px);text-shadow:6px 6px #281018;letter-spacing:2px}.sub{margin:8px 0 24px;font-size:14px}.start button, .tb{font:inherit;color:#fff;background:#191620;border:3px solid #eadfc6;padding:10px 16px;box-shadow:5px 5px 0 #030205;cursor:pointer}.touch{display:none;position:absolute;left:10px;right:10px;bottom:10px;justify-content:space-between;z-index:7;pointer-events:none}.pad,.acts{display:flex;gap:7px}.tb{pointer-events:auto;width:50px;height:50px;padding:0;border-color:#4b4353;background:#16131cd9}.wide{width:82px}
@media(pointer:coarse){.touch{display:flex}.dialog{bottom:20%}.hud .badge{font-size:10px}}
</style></head><body><div class="wrap"><div class="shell"><canvas id="g" width="320" height="180"></canvas>
<div class="hud"><div class="badge">🍅 토비토<div class="bar"><div id="hp" class="fill"></div></div></div><div class="badge">🥕 구출 <span id="resc">0/4</span></div></div>
<div id="toast" class="toast"></div><div id="dlg" class="dialog"><div id="sp" class="speaker"></div><div id="tx" class="text"></div><div class="hint">[SPACE / ENTER / 터치] 계속</div></div>
<div id="touch" class="touch"><div class="pad"><button class="tb" data-k="left">◀</button><button class="tb" data-k="right">▶</button><button class="tb" data-k="up">▲</button><button class="tb" data-k="down">▼</button></div><div class="acts"><button class="tb wide" data-k="attack">공격</button><button class="tb wide" data-k="dash">돌진</button></div></div>
<div id="start" class="start"><div><div style="font-size:12px;color:#aaa">A PIXEL ADVENTURE</div><h1>TOMANTO</h1><div class="sub">어느 날 아침, 요리사 토비는 토마토가 되었다.</div><button id="startBtn">게임 시작</button><div style="font-size:10px;color:#817b8b;margin-top:14px">Galmuri Pixel Prototype · WASD / 방향키 · E 조사</div></div></div>
</div></div>
<script>
const c=document.getElementById('g'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const W=320,H=180;const keys={};let state='title',dq=[],di=0,boss=false,toastT=0;
const P={x:55,y:205,sp:1.55,hp:5,max:5,inv:0,atk:0,dash:0,fx:1,fy:0};
const world={floor:{x:25,y:25,w:670,h:370},obs:[{x:85,y:70,w:90,h:26,t:'table'},{x:250,y:60,w:115,h:24,t:'counter'},{x:525,y:72,w:95,h:50,t:'stove'},{x:520,y:260,w:110,h:72,t:'fridge'},{x:80,y:275,w:95,h:55,t:'sink'},{x:250,y:300,w:115,h:42,t:'island'}]};
const ing=[
{id:'onion',n:'양파 양이',x:205,y:125,col:'#d9cadc',acc:'#a58eae',talk:'난 양파 양이야! 거대 악마가 또 우리 친구를 데려갔어.'},
{id:'carrot',n:'당근 카로',x:445,y:168,col:'#ef8739',acc:'#66b35a',talk:'조심해! 저쪽에서 칼 소리가 들렸어!'},
{id:'potato',n:'감자 포테',x:430,y:335,col:'#b9915e',acc:'#6c5437',talk:'거대 악마는 우리보다 수십 배나 크대…'},
{id:'garlic',n:'마늘 마루',x:640,y:185,col:'#eee8da',acc:'#b5aa93',talk:'잠깐… 토비토? 그 이름, 이상하게 익숙한데?'}];
const E=[{x:155,y:185,h:2,m:2,t:0},{x:335,y:168,h:2,m:2,t:0},{x:470,y:235,h:3,m:3,t:1},{x:590,y:205,h:3,m:3,t:1},{x:290,y:205,h:3,m:3,t:0}];let parts=[];
function R(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h)}function T(s,x,y,z=8,col='#fff',a='left'){ctx.font=z+'px Galmuri11,monospace';ctx.fillStyle=col;ctx.textAlign=a;ctx.fillText(s,Math.round(x),Math.round(y))}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function blocked(x,y,r){if(x-r<world.floor.x||x+r>695||y-r<25||y+r>395)return true;return world.obs.some(o=>{let cx=clamp(x,o.x,o.x+o.w),cy=clamp(y,o.y,o.y+o.h),dx=x-cx,dy=y-cy;return dx*dx+dy*dy<(r+2)*(r+2)})}
function move(o,dx,dy,r){if(!blocked(o.x+dx,o.y,r))o.x+=dx;if(!blocked(o.x,o.y+dy,r))o.y+=dy}
function burst(x,y,col,n=8){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*2.8,vy:(Math.random()-.5)*2.8,t:25+Math.random()*15,c:col})}
function say(lines){dq=lines.map(v=>({s:v[0],t:v[1]}));di=0;document.getElementById('dlg').style.display='block';renderDlg()}
function renderDlg(){if(di>=dq.length){document.getElementById('dlg').style.display='none';return}document.getElementById('sp').textContent=dq[di].s;document.getElementById('tx').textContent=dq[di].t}
function adv(){di++;renderDlg()}
function pop(s){let q=document.getElementById('toast');q.textContent=s;q.style.display='block';toastT=100}
function attack(){if(P.atk)return;P.atk=26;burst(P.x+P.fx*11,P.y+P.fy*11,'#ffd86a',5);for(const e of E){if(e.h<=0)continue;let dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)||1;if(d<22&&(dx*P.fx+dy*P.fy)/d>-.1){e.h--;burst(e.x,e.y,'#ff5a63',7);if(e.h<=0)pop('적을 쓰러뜨렸습니다!')}}}
function dash(){if(P.dash)return;P.dash=65;for(let i=0;i<4;i++)move(P,P.fx*4,P.fy*4,7);burst(P.x,P.y,'#ff9aa0',10)}
function interact(){for(const n of ing)if(!n.saved&&Math.hypot(n.x-P.x,n.y-P.y)<25){n.saved=true;let k=ing.filter(v=>v.saved).length;document.getElementById('resc').textContent=k+'/4';say([['토비토','저기요! 저는… 토비토예요.'],[n.n,n.talk],['토비토','거대 악마라면 제가 막을게요. 모두를 구해낼게요!']]);return}}
function update(){if(state!=='play'||document.getElementById('dlg').style.display!=='none')return;let dx=0,dy=0;if(keys.left||keys.ArrowLeft||keys.a)dx--;if(keys.right||keys.ArrowRight||keys.d)dx++;if(keys.up||keys.ArrowUp||keys.w)dy--;if(keys.down||keys.ArrowDown||keys.s)dy++;if(dx||dy){let l=Math.hypot(dx,dy);dx/=l;dy/=l;P.fx=dx||P.fx;P.fy=dy||P.fy;move(P,dx*P.sp,dy*P.sp,7)}if(keys.attack){attack();keys.attack=false}if(keys.dash){dash();keys.dash=false}if(keys.e){interact();keys.e=false}if(P.atk)P.atk--;if(P.dash)P.dash--;if(P.inv)P.inv--;for(const e of E){if(e.h<=0)continue;let dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;if(d<105){move(e,dx/d*(e.t?.38:.25),dy/d*(e.t?.38:.25),6)}if(d<12&&!P.inv){P.hp--;P.inv=45;document.getElementById('hp').style.width=P.hp/P.max*100+'%';if(P.hp<=0){P.hp=P.max;P.x=55;P.y=205;document.getElementById('hp').style.width='100%';pop('토비토는 다시 살아났다!')}}}for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy*=.96;p.t--}parts=parts.filter(p=>p.t>0);if(toastT&&!--toastT)document.getElementById('toast').style.display='none';if(ing.every(n=>n.saved)&&P.x>625&&P.y>300&&!boss){boss=true;state='play';say([['???','쾅!!'],['마늘 마루','토비토! 거대 악마가 왔어!!'],['토비토','저 칼… 저 모자… 잠깐만.'],['토비토','설마… 거대 악마의 정체가…']])}}
let cam={x:0,y:0};function bg(){R(0,0,W,H,'#14121a');let ox=-cam.x,oy=-cam.y;R(25+ox,25+oy,670,370,'#604b40');for(let y=25;y<395;y+=16)for(let x=25;x<695;x+=16)R(x+ox,y+oy,16,16,((x+y)/16%2? '#604b40':'#675246'));R(25+ox,25+oy,670,10,'#2d2834');R(25+ox,385+oy,670,10,'#2d2834');R(25+ox,25+oy,10,370,'#2d2834');R(685+ox,25+oy,10,370,'#2d2834');for(const o of world.obs){let x=o.x+ox,y=o.y+oy;if(o.t==='table'){R(x,y,o.w,o.h,'#79583e');R(x+5,y+5,o.w-10,o.h-10,'#9a734f')}if(o.t==='counter'){R(x,y,o.w,o.h,'#92979a');R(x+6,y+5,o.w-12,9,'#d4d7d7')}if(o.t==='stove'){R(x,y,o.w,o.h,'#2d2c31');R(x+8,y+6,33,15,'#4b4a50');R(x+54,y+6,33,15,'#4b4a50')}if(o.t==='fridge'){R(x,y,o.w,o.h,'#b4bcc5');R(x+7,y+8,o.w-14,o.h-16,'#d8dde1');R(x+82,y+22,4,21,'#5a626c')}if(o.t==='sink'){R(x,y,o.w,o.h,'#899da6');R(x+24,y+10,45,24,'#c2d0d5')}if(o.t==='island'){R(x,y,o.w,o.h,'#5c4536');R(x+6,y+5,o.w-12,o.h-10,'#87644b')}}R(185+ox,200+oy,175,66,'#303942');for(let x=190;x<360;x+=12)for(let y=205;y<265;y+=12)if((x+y)%24===0)R(x+ox,y+oy,8,8,'#46535b');R(640+ox,35+oy,38,20,'#243b2b');T('EXIT',659+ox,49+oy,7,'#8ee085','center')}
function tomato(x,y){x-=cam.x;y-=cam.y;if(P.inv&&Math.floor(Date.now()/80)%2)return;R(x-7,y-7,14,12,'#d84049');R(x-5,y-9,10,3,'#f05d61');R(x-3,y-11,6,2,'#5eac57');R(x-8,y-2,2,6,'#972a31');R(x+6,y-2,2,6,'#972a31');R(x-4,y-4,2,2,'#ffe7da');R(x-3,y-13,7,2,'#f1eee6')}
function drawIng(n){let x=n.x-cam.x,y=n.y-cam.y;if(n.id==='onion'){R(x-7,y-8,14,14,n.col);R(x-4,y-11,8,3,n.acc)}else if(n.id==='carrot'){R(x-5,y-8,10,15,n.col);R(x-3,y-11,6,5,n.acc)}else if(n.id==='potato'){R(x-9,y-6,18,12,n.col);R(x-6,y-9,12,3,n.col)}else{R(x-8,y-7,16,14,n.col);R(x-4,y-10,8,4,n.col);R(x-1,y-12,2,2,n.acc)}R(x-4,y-1,2,2,'#17131b');R(x+2,y-1,2,2,'#17131b');T(n.n,n.x,n.y-14,6,n.saved?'#8a8490':'#fff','center')}
function enemy(e){let x=e.x-cam.x,y=e.y-cam.y;if(e.h<=0)return;if(e.t===0){R(x-7,y-6,14,12,'#6b9865');R(x-5,y-8,4,3,'#82b279');R(x+2,y-9,4,4,'#82b279')}else{R(x-3,y-10,6,20,'#d9dde6');R(x-5,y+3,10,4,'#858b97');R(x-2,y-13,4,4,'#fff5c8')}}function draw(){cam.x=clamp(P.x-W/2,0,400);cam.y=clamp(P.y-H/2,0,240);bg();ing.slice().sort((a,b)=>a.y-b.y).forEach(drawIng);E.slice().sort((a,b)=>a.y-b.y).forEach(enemy);if(boss){let x=640-cam.x,y=180-cam.y;R(x-30,y-42,60,60,'#211f28');R(x-22,y-60,44,18,'#d9d5cb');R(x-16,y-70,32,10,'#eee9df');R(x-44,y-5,8,60,'#dce0e8');T('???',x,y+38,8,'#ff6b73','center')}tomato(P.x,P.y);for(const p of parts)R(p.x-cam.x,p.y-cam.y,2,2,p.c);T(ing.every(n=>n.saved)?'출구로 가라!':'식재료를 구해라!',8,172,7,'#fff')}
document.getElementById('startBtn').onclick=()=>{state='play';document.getElementById('start').style.display='none';say([['토비','…아침인가?'],['토비','잠깐. 왜 손이 안 보이지?'],['토비','……'],['토비','나 토마토인데?'],['토비','좋아. 일단 주방부터 확인하자.']] )};
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '||e.key==='Enter'){e.preventDefault();if(document.getElementById('dlg').style.display!=='none')adv();else keys.attack=true}if(e.key==='E'||e.key==='e')keys.e=true;if(e.key==='Shift')keys.dash=true});addEventListener('keyup',e=>keys[e.key]=false);
for(const b of document.querySelectorAll('.tb')){let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='attack')keys.attack=true;else if(k==='dash')keys.dash=true;else keys[k]=true});b.addEventListener('pointerup',e=>{if(['left','right','up','down'].includes(k))keys[k]=false})}
document.getElementById('dlg').addEventListener('pointerdown',adv);(function loop(){update();draw();requestAnimationFrame(loop)})();
</script></body></html>
